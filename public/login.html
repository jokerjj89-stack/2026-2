<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 로그인 · 부스 QR 카운터</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:0 16px}
  form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;display:grid;gap:12px}
  h1{margin:0;font-size:20px}
  p{margin:0;color:var(--muted);font-size:14px}
  input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
  .err{color:var(--danger)}
  button{justify-content:center;padding:10px}
</style></head>
<body>
<form method="post" action="/admin/login">
  <h1>부스 QR 카운터</h1>
  <p>관리자 비밀번호를 입력하세요.</p>
  <p class="err" id="err" hidden>비밀번호가 맞지 않습니다. 다시 입력해 주세요.</p>
  <label for="pw" class="hint" style="margin:0">비밀번호</label>
  <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
  <button class="primary" type="submit">로그인</button>
</form>
<script>if(location.search.includes('err=1'))document.getElementById('err').hidden=false;</script>
</body></html>
